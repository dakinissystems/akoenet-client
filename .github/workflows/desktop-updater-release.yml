name: Desktop updater release

# Signed Windows build → public/releases/desktop (latest.json + installer) on main
# → Railway serves updater → desktop apps auto-update on launch.
# Also creates a GitHub Release (Releases tab).

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create/update GitHub Release for package.json version
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-updater-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Verify version sync
        run: npm run verify-versions

      - name: Tag must match package.json (tag pushes)
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != package.json ${EXPECTED}. Bump version, commit, then tag."
            exit 1
          fi

      - name: Require signing key secret
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Add secret TAURI_SIGNING_PRIVATE_KEY (akoenet-signer.key). See docs/DESKTOP-UPDATER.md"
            exit 1
          fi

      - name: Build signed desktop + updater manifest
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_PUBLIC_ORIGIN: https://akoenet.dakinissystems.com
        run: npm run release:desktop

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          test -f public/releases/desktop/latest.json
          cat public/releases/desktop/latest.json

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-updater-${{ steps.ver.outputs.version }}
          path: |
            public/releases/desktop/latest.json
            public/releases/desktop/*.exe
            public/releases/desktop/*.msi
            public/releases/desktop/*.sig
            releases/desktop/${{ steps.ver.outputs.version }}/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-updater-${{ needs.build-windows.outputs.version }}
          path: _desktop_out

      - name: Place artifacts in repo tree
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-windows.outputs.version }}"
          mkdir -p public/releases/desktop "releases/desktop/${VERSION}"
          cp -f _desktop_out/public/releases/desktop/* public/releases/desktop/ 2>/dev/null || true
          # artifact layout may be flat if upload flattened paths
          find _desktop_out -type f \( -name 'latest.json' -o -name '*.exe' -o -name '*.msi' -o -name '*.sig' \) -print0 |
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              if [[ "$base" == latest.json || "$base" == *.exe || "$base" == *.msi || "$base" == *.sig ]]; then
                cp -f "$f" "public/releases/desktop/$base"
              fi
              if [[ "$f" == *"/releases/desktop/${VERSION}/"* ]]; then
                cp -f "$f" "releases/desktop/${VERSION}/$base"
              fi
            done
          ls -la public/releases/desktop/
          test -f public/releases/desktop/latest.json

      - name: Commit updater artifacts to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/releases/desktop/latest.json \
                  public/releases/desktop/*.exe \
                  public/releases/desktop/*.msi \
                  public/releases/desktop/*.sig \
                  "releases/desktop/${{ needs.build-windows.outputs.version }}" || true
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "release(desktop): publish updater artifacts ${{ needs.build-windows.outputs.version }}"
          git push origin main

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: AkoeNet ${{ needs.build-windows.outputs.version }}
          generate_release_notes: true
          files: |
            public/releases/desktop/*.exe
            public/releases/desktop/*.msi
            public/releases/desktop/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
